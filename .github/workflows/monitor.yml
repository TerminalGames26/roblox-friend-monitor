name: Roblox Friend Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Roblox friends
        env:
          ROBLOX_USER_ID: ${{ secrets.ROBLOX_USER_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python monitor.py

      - name: Save updated friend snapshot
        run: |
          git config user.name "Roblox Friend Monitor"
          git config user.email "actions@users.noreply.github.com"

          git add friend_snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update friend snapshot"
            git push
          fi
